spring:
  application:
    name: CrossRow
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB     # 单个文件的最大限制 (默认是 1MB)
      max-request-size: 15MB
server:
  port: 8123
  servlet:
    context-path: /api
  shutdown: graceful
  # springdoc-openapi interface setting
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.dyx.crossrow.controller
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    org.springframework.ai: DEBUG