services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: crossrow-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"  # 只绑定本地
    restart: unless-stopped    # 添加重启策略
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: crossrow-redis
    ports:
      - "127.0.0.1:6379:6379"  # 只绑定本地
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: crossrow-elasticsearch
    environment:
      - node.name=es01
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      # SSL/用户认证
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # 限制内存，防止占满宿主机
    # 限制进程可以锁定的内存量。soft/hard: -1 = 无限制。
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"  # 只绑定本地
    restart: unless-stopped    # 添加重启策略
    command: >
      sh -c "
        if [ ! -d /usr/share/elasticsearch/plugins/analysis-ik ]; then
          bin/elasticsearch-plugin install --batch https://get.infini.cloud/elasticsearch/analysis-ik/8.17.0
        fi &&
        exec /usr/share/elasticsearch/bin/elasticsearch
      "
    healthcheck: # 添加健康检查
      test: [ "CMD-SHELL", "curl -s http://localhost:9200 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build: .
    container_name: crossrow-backend
    ports:
      - "127.0.0.1:8123:8123"
    depends_on:
      - postgres
      - redis
      - elasticsearch
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_ELASTICSEARCH_HOST=elasticsearch
    volumes:
      - ./config:/app/config
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
  es_data: